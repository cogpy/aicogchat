# Ask an AtomSpace development question using the atomspace role
# Copy to: ~/.config/chaicog/macros/opencog-init.yaml
# Usage:   .macro opencog-init <question>      (REPL)
#          chaicog --macro opencog-init <question>
#
# Macros run on a copy of the current config, so the role/model set here
# apply only to this question. For an ongoing session, run .role atomspace
# (and .session <name>) directly in the REPL instead.
variables:
  - name: question
    rest: true
steps:
  - .role atomspace
  - "{{question}}"
