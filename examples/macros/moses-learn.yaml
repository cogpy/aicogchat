# Ask a MOSES program-learning question using the moses role
# Copy to: ~/.config/chaicog/macros/moses-learn.yaml
# Usage:   .macro moses-learn <question>      (REPL)
#          chaicog --macro moses-learn <question>
#
# Macros run on a copy of the current config, so the role/model set here
# apply only to this question. For an ongoing session, run .role moses
# (and .session <name>) directly in the REPL instead.
variables:
  - name: question
    rest: true
steps:
  - .role moses
  - .model opencog:opencog-reasoning
  - "{{question}}"
