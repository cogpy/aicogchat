# Ask an OpenCog debugging/logging question using the cogutil role
# Copy to: ~/.config/chaicog/macros/opencog-debug.yaml
# Usage:   .macro opencog-debug <question>      (REPL)
#          chaicog --macro opencog-debug <question>
#
# Macros run on a copy of the current config, so the role/model set here
# apply only to this question. For an ongoing session, run .role cogutil
# (and .session <name>) directly in the REPL instead.
variables:
  - name: question
    rest: true
steps:
  - .role cogutil
  - "{{question}}"
