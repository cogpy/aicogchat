# Ask a MeTTa/Hyperon question using the hyperon role and hyperon model
# Copy to: ~/.config/chaicog/macros/hyperon-metta.yaml
# Usage:   .macro hyperon-metta <question>      (REPL)
#          chaicog --macro hyperon-metta <question>
#
# Macros run on a copy of the current config, so the role/model set here
# apply only to this question. For an ongoing session, run .role hyperon
# (and .session <name>) directly in the REPL instead.
variables:
  - name: question
    rest: true
steps:
  - .role hyperon
  - .model opencog:opencog-hyperon
  - "{{question}}"
